[package]
  name         = "games-grid"
  version      = "0.1.0"
  edition      = "2024"
  description  = "TUI Application for Banco de Dados I"
  readme       = "README.md"
  license-file = "LICENSE"

[dependencies]
  color-eyre = "0.6.5"
  crossterm  = "0.29.0"
  postgres   = { version = "0.19.14", features = ["with-uuid-1"] }
  ratatui    = "0.30.2"
  uuid       = { version = "1.29.3", features = ["v4"] }

[profile.release]
  opt-level     = "s"
  strip         = true
  lto           = true
  codegen-units = 1
